<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GEKLIKT!</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 99%;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #e9e9e9;
        color: var(--text);
      }

      .center-card {
        width: min(560px, 90vw);
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }
      button {
        padding: 0.9rem 3rem;
        font-size: 1.2rem;
        cursor: pointer;
      }
      p {
        margin: 4px;
        text-decoration: underline;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="center-card">
      <h1 id="headline">HAHA! JE HEBT GEKLIKT!</h1>
      <button id="big-button" onclick="buttonClicked()">
        Klik Voor Een Cadeau
      </button>
    </div>
    <script>
      function buttonClicked() {
        window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
      }
    </script>
  </body>
</html>
